<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">Press releases per party per day, October 12 to November 11, 2026</title><desc id="d">A line chart of Lane-1 press releases per day for each party, from the published day records. The Democratic line is solid and the Republican line is dashed. A hatched band covers October 28 to November 10, the fourteen days assembled after the fact on November 11 and not posted to Bluesky. A vertical rule marks Election Day, November 3, when the records hold 18 Democratic and 7 Republican statements. Weekend days drop near zero for both parties.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#5a5a5a" stroke-width="1" opacity="0.35"/></pattern></defs><rect x="0" y="0" width="900" height="400" fill="#fbfbf9"/><rect x="483.7" y="30" width="382.7" height="300" fill="url(#hatch)"/><text x="675.0" y="44" font-size="12" fill="#1a1a1a" text-anchor="middle">Assembled after the fact on Nov 11. Site only, not posted.</text><line x1="60" y1="330.0" x2="880" y2="330.0" stroke="#e2e2e2"/><text x="52" y="334.0" font-size="12" fill="#5a5a5a" text-anchor="end">0</text><line x1="60" y1="255.0" x2="880" y2="255.0" stroke="#e2e2e2"/><text x="52" y="259.0" font-size="12" fill="#5a5a5a" text-anchor="end">25</text><line x1="60" y1="180.0" x2="880" y2="180.0" stroke="#e2e2e2"/><text x="52" y="184.0" font-size="12" fill="#5a5a5a" text-anchor="end">50</text><line x1="60" y1="105.0" x2="880" y2="105.0" stroke="#e2e2e2"/><text x="52" y="109.0" font-size="12" fill="#5a5a5a" text-anchor="end">75</text><line x1="60" y1="30.0" x2="880" y2="30.0" stroke="#e2e2e2"/><text x="52" y="34.0" font-size="12" fill="#5a5a5a" text-anchor="end">100</text><text x="16" y="180.0" font-size="12" fill="#