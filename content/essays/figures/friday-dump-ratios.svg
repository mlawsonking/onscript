<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">Friday rate compared with the Monday-to-Thursday average, three word lists</title>
<desc id="d">A dot chart of six ratios. Each ratio is the Friday rate of a pre-registered word list divided by the average Monday-to-Thursday rate, in congressional press releases. Walk-back language: 0.85 for 2013 to 2020 (95 percent interval 0.72 to 1.00) and 0.96 for 2021 to mid-2026 (interval 0.76 to 1.20). Placebo word list: 0.98 and 0.96. Positive control, week-ending words: 2.10 and 1.75. A vertical line at 1.0 marks no Friday difference; a dashed line at 1.5 marks the pre-registered threshold. Only the positive control crosses it.</desc>
<rect x="0" y="0" width="900" height="400" fill="#fbfbf9"/>
<line x1="250.0" y1="40" x2="250.0" y2="324" stroke="#e2e2e2"/>
<text x="250.0" y="342" text-anchor="middle" font-size="11" fill="#707070">0.50x</text>
<line x1="331.9" y1="40" x2="331.9" y2="324" stroke="#e2e2e2"/>
<text x="331.9" y="342" text-anchor="middle" font-size="11" fill="#707070">0.75x</text>
<line x1="413.9" y1="40" x2="413.9" y2="324" stroke="#e2e2e2"/>
<text x="413.9" y="342" text-anchor="middle" font-size="11" fill="#707070">1.00x</text>
<line x1="495.8" y1="40" x2="495.8" y2="324" stroke="#e2e2e2"/>
<text x="495.8" y="342" text-anchor="middle" font-size="11" fill="#707070">1.25x</text>
<line x1="577.8" y1="40" x2="577.8" y2="324" stroke="#e2e2e2"/>
<text x="577.8" y="342" text-anchor="middle" font-size="11" fill="#707070">1.50x</text>
<line x1="659.7" y1="40" x2="659.7" y2="324" stroke="#e2e2e2"/>
<text x="659.7" y="342" text-anchor="middle" font-size="11" fill="#707070">1.75x</text>
<line x1="741.7" y1="40" x2="741.7" y2="324" stroke="#e2e2e2"/>
<text x="741.7" y="342" text-anchor="middle" font-size="11" fill="#707070">2.00x</text>
<line x1="823.6" y1="40" x2="823.6" y2="324" stroke="#e2e2e2"/>
<text x="823.6" y="342" text-anchor="middle" font-size="11" fill="#707070">2.25x</text>
<line x1="413.9" y1="36" x2="413.9" y2="324" stroke="#1f1f1f" stroke-width="1.5"/>
<text x="413.9" y="30" text-anchor="middle" font-size="11" fill="#1f1f1f">1.0 = Friday same as Mon-Thu</text>
<line x1="577.8" y1="36" x2="577.8" y2="324" stroke="#1f1f1f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="581.8" y="30" text-anchor="start" font-size="11" fill="#1f1f1f">1.5 = pre-registered threshold</text>
<text x="16" y="80" font-size="13" font-weight="600" fill="#1f1f1f">Walk-back language</text>
<text x="238" y="80" text-anchor="end" font-size="12" fill="#707070">2013 to 2020</text>
<line x1="323.3" y1="76" x2="413.4" y2="76" stroke="#2b4c7e" stroke-width="2"/>
<line x1="323.3" y1="71" x2="323.3" y2="81" stroke="#2b4c7e" stroke-width="2"/>
<line x1="413.4" y1="71" x2="413.4" y2="81" stroke="#2b4c7e" stroke-width="2"/>
<circle cx="364.7" cy="76" r="6" fill="#2b4c7e"/>
<text x="423.4" y="80" font-size="12" fill="#1f1f1f">0.85x (95% CI 0.72-1.00)</text>
<text x="238" y="124" text-anchor="end" font-size="12" fill="#707070">2021 to mid-2026</text>
<line x1="336.4" y1="120" x2="479.7" y2="120" stroke="#2b4c7e" stroke-width="2"/>
<line x1="336.4" y1="115" x2="336.4" y2="125" stroke="#2b4c7e" stroke-width="2"/>
<line x1="479.7" y1="115" x2="479.7" y2="125" stroke="#2b4c7e" stroke-width="2"/>
<circle cx="400.1" cy="120" r="6" fill="#2b4c7e"/>
<text x="489.7" y="124" font-size="12" fill="#1f1f1f">0.96x (95% CI 0.76-1.20)</text>
<text x="16" y="168" font-size="13" font-weight="600" fill="#1f1f1f">Placebo (routine thanks, pride)</text>
<text x="238" y="168" text-anchor="end" font-size="12" fill="#707070">2013 to 2020</text>
<rect x="401.0" y="158.5" width="11" height="11" fill="#fbfbf9" stroke="#6b6b6b" stroke-width="2"/>
<text x="418.5" y="168" font-size="12" fill="#1f1f1f">0.98x</text>
<text x="238" y="212" text-anchor="end" font-size="12" fill="#707070">2021 to mid-2026</text>
<rect x="394.1" y="202.5" width="11" height="11" fill="#fbfbf9" stroke="#6b6b6b" stroke-width="2"/>
<text x="411.6" y="212" font-size="12" fill="#1f1f1f">0.96x</text>
<text x="16" y="256" font-size="13" font-weight="600" fill="#1f1f1f">Positive control (week words)</text>
<text x="238" y="256" text-anchor="end" font-size="12" fill="#707070">2013 to 2020</text>
<polygon points="774.4,245 781.4,257 767.4,257" fill="#8a5a00"/>
<text x="786.4" y="256" font-size="12" fill="#1f1f1f">2.10x</text>
<text x="238" y="300" text-anchor="end" font-size="12" fill="#707070">2021 to mid-2026</text>
<polygon points="659.3,289 666.3,301 652.3,301" fill="#8a5a00"/>
<text x="671.3" y="300" font-size="12" fill="#1f1f1f">1.75x</text>
<text x="16" y="370" font-size="11" fill="#707070">Ratio = Friday matches per statement / mean of the four Mon-Thu rates. Congressional press releases, 674,970 statements, 2013 to 2026-07-09.</text>
<text x="16" y="386" font-size="11" fill="#707070">Whiskers: 95% day-block bootstrap interval (walk-back only). Marker shape identifies the word list: circle, square, triangle.</text>
</svg>
