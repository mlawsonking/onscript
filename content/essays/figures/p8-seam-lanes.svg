<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">Monthly press-release records in each provenance lane, 2017 to 2022</title><desc id="d">A line chart of records per month in the two main lanes of the press-release mirror. The legacy lane, a ProPublica import drawn solid, carries between 2,416 and 7,978 records a month from 2017 through December 2020 (4,691 that month), 229 in the first three days of January 2021, and zero after 2021-01-03. The scraper lane, drawn dashed, carries between 185 and 1,049 records a month before 2021 and between 1,097 and 2,307 from January 2021 through 2022. A vertical rule marks 2021-01-03. The third lane, page_html, carries at most 37 records a month in this window and is not drawn.</desc><rect x="0" y="0" width="900" height="420" fill="#fbfbf9"/><line x1="76" y1="320.0" x2="880" y2="320.0" stroke="#e2e2dc" stroke-width="1"/><text x="68" y="324.0" text-anchor="end" font-size="11" fill="#707070">0</text><line x1="76" y1="247.5" x2="880" y2="247.5" stroke="#e2e2dc" stroke-width="1"/><text x="68" y="251.5" text-anchor="end" font-size="11" fill="#707070">2,000</text><line x1="76" y1="175.0" x2="880" y2="175.0" stroke="#e2e2dc" stroke-width="1"/><text x="68" y="179.0" text-anchor="end" font-size="11" fill="#707070">4,000</text><line x1="76" y1="102.5" x2="880" y2="102.5" stroke="#e2e2dc" stroke-width="1"/><text x="68" y="106.5" text-anchor="end" font-size="11" fill="#707070">6,000</text><line x1="76" y1="30.0" x2="880" y2="30.0" stroke="#e2e2dc" stroke-width="1"/><text x="68" y="34.0" text-anchor="end" font-size="11" fill="#707070">8,000</text><line x1="609.3" y1="30" x2="609.3" y2="320" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="2 3"/><text x="615.3" y="42" font-size="12" fill="#1a1a1a">2021-01-03: the legacy lane ends</text><polyline fill="none" stroke="#3