<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">How often each side names the sitting president, 2013 to 2026</title><desc id="d">A line chart with one point per year from 2013 to 2026. Each point is the number of times the sitting president's surname appears per 1,000 words of a party's member press releases. The solid line with filled circles is the party out of the White House that year; the dashed line with hollow squares is the president's own party. The solid line is above the dashed line in 14 of 14 years. Vertical rules mark the White House changes in January 2017, 2021 and 2025. The lines break at 2021 because the series changes dataset there. Values by year, out-party then in-party: 2013 Obama, 1.16 and 0.44; 2014 Obama, 1.33 and 0.55; 2015 Obama, 1.01 and 0.44; 2016 Obama, 1.10 and 0.56; 2017 Trump, 2.52 and 1.23; 2018 Trump, 1.69 and 0.87; 2019 Trump, 1.42 and 1.08; 2020 Trump, 1.13 and 1.01; 2021 Biden, 2.11 and 0.99; 2022 Biden, 2.59 and 0.84; 2023 Biden, 2.28 and 0.80; 2024 Biden, 2.08 and 0.92; 2025 Trump, 3.27 and 2.07; 2026 Trump, 3.24 and 1.30.</desc><rect x="0" y="0" width="900" height="400" fill="#fbfbf9"/><rect x="76.0" y="64" width="229.7" height="266" fill="#000" opacity="0.03"/><text x="190.9" y="54" text-anchor="middle" font-size="12" fill="#5a5a5a">Obama (D)</text><text x="420.6" y="54" text-anchor="middle" font-size="12" fill="#5a5a5a">Trump (R)</text><line x1="305.7" y1="60" x2="305.7" y2="330" stroke="#9a9a9a" stroke-width="1"/><rect x="535.4" y="64" width="229.7" height="266" fill="#000" opacity="0.03"/><text x="650.3" y="54" text-anchor="middle" font-size="12" fill="#5a5a5a">Biden (D)</text><line x1="535.4" y1="60" x2="535.4" y2="330" stroke="#9a9a9a" stroke-width="1"/><text x="822.6" y="54" text-anchor="middle" font-size="12" fill="#5a5a5a">Trump (R)</text><lin