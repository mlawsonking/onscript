<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="442" viewBox="0 0 1110 442" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">Verdicts before and after the provenance seam was found</title><desc id="d">A table of findings from the search ledger. For each: the verdict recorded before the seam was found, the verdict inside the ProPublica lane (2013 to 2020), the verdict inside the scraped lane (2021 to 2026), and a one-line reading. S1.9 confirmed, unchanged. S2.9 confirmed in both lanes. S2.3 refuted in both lanes. S1.4 refuted in both lanes; its Democrats-rose-in-both-halves sub-claim was the seam; no lane has both parties rising in both halves. S1.1 prime and S1.3 prime went from refuted to confirmed inside the ProPublica lane, are not confirmed in the scraped lane, and are under review. S1.6 refuted in the ProPublica lane (1 of 2 early cycles, 2 of 2 late) and underpowered in the scraped lane. S2.7 confirmed in one lane only, so it is not a finding. S1.10 stays an artifact after dropping the 2020 cycle. S1.1 and S1.3 stay artifacts in both lanes. Eleven other refutations are unchanged in both lanes. No verdict moved toward a false positive.</desc><rect x="0" y="0" width="1110" height="442" fill="#fbfbf9"/><text x="16" y="20" font-size="12" fill="#5a5a5a">Search-ledger verdicts, re-run inside one provenance lane (docs/13, 2026-07-17; page_html isolation re-check 2026-07-27)</text><text x="16" y="46" font-size="12" font-weight="700" fill="#1a1a1a">Finding</text><text x="258" y="46" font-size="12" font-weight="700" fill="#1a1a1a">Before the seam was found</text><text x="462" y="46" font-size="12" font-weight="700" fill="#1a1a1a">ProPublica lane, 2013–2020</text><text x="640" y="46" font-size="12" font-weight="700" fill="#1a1a1a">Scraped lane, 2021–2026</text><text x="800" y="46" font-size="12" font-weight="700" fill="#1a1a1a">Reading</text><line x1="16" y1="54" x2="109