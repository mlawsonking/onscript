<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">Talking-point bursts by year, one panel per data source</title><desc id="d">Two side-by-side panels with the same vertical scale, in days, one per data source; the panels are not joined. Left panel, the first instrument, 2013 to 2020: the median ignition width of a talking-point burst (days from its first day to its peak day), drawn as a solid line with filled circles, goes 34, 13, 8, 12, 6, 12, 3, 3 days by year; the median burst lifespan (first to last day), drawn as a dashed line with squares, goes 55.5, 32, 29, 31, 24.5, 35, 10, 15 days. Right panel, the second instrument, 2021 to 2026, drawn in grey because no trend there passed the same tests: ignition width 12, 0, 2, 13, 17, 2 days; lifespan 20, 8, 23, 31, 59, 21.5 days.</desc><rect x="0" y="0" width="900" height="440" fill="#fbfbf9"/><line x1="70" y1="330.0" x2="480" y2="330.0" stroke="#e2e2e2"/><text x="64" y="334.0" text-anchor="end" font-size="11" fill="#707070">0</text><line x1="70" y1="262.0" x2="480" y2="262.0" stroke="#e2e2e2"/><text x="64" y="266.0" text-anchor="end" font-size="11" fill="#707070">15</text><line x1="70" y1="194.0" x2="480" y2="194.0" stroke="#e2e2e2"/><text x="64" y="198.0" text-anchor="end" font-size="11" fill="#707070">30</text><line x1="70" y1="126.0" x2="480" y2="126.0" stroke="#e2e2e2"/><text x="64" y="130.0" text-anchor="end" font-size="11" fill="#707070">45</text><line x1="70" y1="58.0" x2="480" y2="58.0" stroke="#e2e2e2"/><text x="64" y="62.0" text-anchor="end" font-size="11" fill="#707070">60</text><text x="80.0" y="348" text-anchor="middle" font-size="11" fill="#707070">2013</text><text x="135.7" y="348" text-anchor="middle" font-size="11" fill="#707070">2014</text><text x="191.4" y="348" text-anchor="middle" font-size="11" fill="#707070">2015</text><text