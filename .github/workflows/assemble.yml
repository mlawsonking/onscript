name: RUN B — assemble

# 07:30 ET (11:30 UTC), ~2h after collect so the Haiku extraction batch has completed.
# Retrieve extractions, cluster into talking points, distill the two Daily Lines (Sonnet
# batch -> direct-call fallback on timeout), run the BLOCKING verifier, render the site + og
# cards, commit derived (Vercel deploys), post both Bluesky threads, publish the symmetry audit.
on:
  schedule:
    # Paired with RUN A's two passes (§deploy-hardening 2026-07-16). Each pass asks the readiness gate
    # for the oldest not-yet-final day that is READY; if none is, it NO-OPS at $0 (no cluster, no
    # distill, no API call) and the next pass picks the day up the moment upstream fills. Two passes
    # also let a backlog DRAIN (one pass can only finalize one day).
    - cron: "30 11,21 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Explicit day to (re)assemble, YYYY-MM-DD. Bypasses the readiness gate — use to
          REPAIR a bad day or backfill one the gate already finalized. Blank = normal gated selection."
        required: false
        default: ""

concurrency:
  group: onscript-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # absent -> dry-run composites, $0
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Art. XIII privacy gate (pipeline/privacy.py). REQUIRED: the gate is fail-closed, so an absent
      # or wrong salt raises at import and the run dies rather than publishing unsuppressed. Never
      # rotate it (that invalidates every committed HMAC + the canary), and never move the salt into
      # data/reference/ — the archive step below tars that directory into a PUBLIC release asset.
      PRIVACY_SALT: ${{ secrets.PRIVACY_SALT }}
      BSKY_BLUE_HANDLE: ${{ secrets.BSKY_BLUE_HANDLE }}
      BSKY_BLUE_PASSWORD: ${{ secrets.BSKY_BLUE_PASSWORD }}
      BSKY_RED_HANDLE: ${{ secrets.BSKY_RED_HANDLE }}
      BSKY_RED_PASSWORD: ${{ secrets.BSKY_RED_PASSWORD }}
      # The S3 launch switch (gameplan §9): a repo VARIABLE, default absent/off. While off, the
      # posting leg is a deterministic dry-run print — no path posts, regardless of the creds above.
      # Michael flips this to "true" in the repo variables UI at launch. (kill-tested)
      POSTING_ENABLED: ${{ vars.POSTING_ENABLED }}
      # The billing switch for the real Sonnet Daily-Line voice: a repo VARIABLE, default absent/off.
      # While off, the daily voice is the deterministic template ($0) even with the key present.
      # Michael flips this to "true" to turn on the ~$0.01/day voice; the code ceiling ($9 MTD) +
      # the $10 Console cap bound the spend, and flipping it off reverts to $0 instantly. §voice-wiring.
      LLM_VOICE_ENABLED: ${{ vars.LLM_VOICE_ENABLED }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state written by RUN A
        run: |
          mkdir -p data/state data/raw data/reference
          gh release download data-latest --dir data/_restore --clobber || echo "no state — assemble will no-op"
          if [ -d data/_restore ]; then
            tar -xzf data/_restore/state.tar.gz -C . || true
            tar -xzf data/_restore/raw.tar.gz -C . || true
          fi

      - name: RUN B assemble (cluster -> distill -> VERIFY -> symmetry)
        # Blank day (the scheduled case) => the readiness gate picks the oldest not-yet-final READY day,
        # or no-ops at $0. A supplied day is an explicit REPAIR/backfill and bypasses the gate.
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python pipeline/run_assemble.py --day "${{ github.event.inputs.day }}"
          else
            python pipeline/run_assemble.py
          fi

      - name: Render the static site
        run: python pipeline/site.py

      - name: Post the Daily Line threads to Bluesky (both accounts)
        run: python pipeline/post_bluesky.py || echo "posting skipped/failed (skip-and-log)"

      - name: Persist updated extraction cache
        run: |
          tar -czf state.tar.gz data/state data/reference
          gh release upload data-latest state.tar.gz --clobber || true

      - name: Commit derived + rendered site (Vercel auto-deploys)
        run: |
          git config user.name "onscript-bot"
          git config user.email "bot@onscript.news"
          git add data/derived site/public
          # NO [skip ci]: these workflows are schedule/dispatch-only (never push-triggered), so the
          # marker does nothing for Actions but makes VERCEL SKIP the deploy — which froze the live
          # site at the last manual push. Without it, every daily data commit auto-deploys. §voice-wiring.
          git commit -m "data: assemble $(date -u +%F)" || echo "no changes"
          git push || echo "push skipped"
