name: RUN A — collect

# 05:30 ET (09:30 UTC). Pull+mirror congress-press, normalize, build the phrase ledger,
# extract talking-point fragments (Haiku batch when ANTHROPIC_API_KEY is set; $0 dry-run
# otherwise). State (ledger + extraction cache + raw mirror) persists as Release assets so the
# compounding series and the never-distill-twice cache survive between runs (gameplan §2).
on:
  schedule:
    # Two passes/day (§deploy-hardening 2026-07-16). The mirror publishes ~05:00 UTC; the 09:30 pass is
    # the normal one. The 19:30 pass exists so a LATE upstream day is re-pulled the SAME day instead of
    # waiting 24h — the readiness gate in RUN B then finalizes it (a late day is recovered, never
    # skipped). Two rather than four: this repo is still PRIVATE (metered Actions minutes) and RUN A
    # runs the phrase engine; it becomes free to add more passes when the repo flips public at S3.
    - cron: "30 9,19 * * *"
  workflow_dispatch: {}

concurrency:
  group: onscript-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # commit derived JSON + manage the data Release
  id-token: write
  attestations: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # 240, was 120: collect wall time grew from ~60m (07-23) to 101m (07-27) as the W4 span-privacy
    # scan and the X packages joined the build, then a 3-day backlog pushed it past 120m and the
    # timeout killed the 07-28 and 07-29 evening runs at exactly 2h00m. This raise is the bridge;
    # the durable fix (persistent span-scan cache over the append-only corpus) has its own work
    # order. Activates on push to main.
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # absent -> dry-run, $0
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Stream python output as it happens: the 2h-timeout runs left a blank log because stdout was
      # block-buffered to the pipe and the kill dropped the buffer. Phase timings must survive a kill.
      PYTHONUNBUFFERED: "1"
      # Art. XIII privacy gate (pipeline/privacy.py) — fail-closed; see assemble.yml for the rules.
      PRIVACY_SALT: ${{ secrets.PRIVACY_SALT }}
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Art. XVI: a fail-closed gate without its key is an outage authored, not safety. The privacy
      # gate raises at IMPORT if PRIVACY_SALT is absent — 14 silent hours on 2026-07-17 proved that a
      # missing secret otherwise surfaces as an unexplained 20-second failure. Fail here, loudly, first.
      - name: Preflight — fail-closed gates must have their keys
        run: |
          missing=""
          [ -n "$PRIVACY_SALT" ] || missing="$missing PRIVACY_SALT"
          [ -n "$NTFY_TOPIC" ]   || missing="$missing NTFY_TOPIC"
          if [ -n "$missing" ]; then
            echo "::error::missing required secret(s):$missing — the privacy gate is fail-closed (dies at import) and the dead-man cannot fire without its topic. Set them in repo Settings > Secrets."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"

      - name: Restore prior state (ledger + extraction cache + raw mirror)
        run: |
          mkdir -p data/state data/raw data/reference
          gh release download data-latest --dir data/_restore --clobber || echo "no prior state (first run)"
          if [ -d data/_restore ]; then
            # Archives are validated in a temporary directory. Runtime-owned files then merge through
            # an allowlist. A stale tracked reference file stops the run instead of replacing the
            # checkout. Repository authority and runtime authority never share a write path.
            python -m pipeline.archive_restore data/_restore --checkout .
          fi

      - name: RUN A collect
        run: python pipeline/run_collect.py

      # R-L (docs/23, ruled 2026-07-21): the release assets are a PUBLISHED surface, so they carry
      # the Article XIII floor like every other one. Runs in place on the runner, whose state was
      # itself restored from the previous asset, so the cloud store converges on the redacted view;
      # the pristine append-only archive lives on X: and no workflow writes there.
      # NO `|| true`: a failure here must stop the job BEFORE the upload. A missed upload costs one
      # cycle and the next run rebuilds it; a leaked one is permanent.
      - name: Redact the release payload (Art. XIII, R-L)
        run: python -m pipeline.redact data/state data/reference data/raw

      - name: Persist state + raw mirror to the data Release
        run: |
          # Only runtime-owned paths belong in the archive (W3 authority split). Everything else
          # under data/reference is TRACKED; shipping it re-creates the 2026-07-26 restore
          # conflict on every future schema change to a tracked reference file.
          tar -czf state.tar.gz data/state data/reference/roster.json
          tar -czf raw.tar.gz data/raw
          python -m pipeline.release_provenance write state.tar.gz raw.tar.gz
          gh release create data-latest --title "OnScript data (rolling)" --notes "raw mirror + ledger + extraction cache" 2>/dev/null || true
          gh release upload data-latest state.tar.gz state.tar.gz.sha256 raw.tar.gz raw.tar.gz.sha256 --clobber

      - name: Attest rolling release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            state.tar.gz
            raw.tar.gz

      - name: Commit deterministic derived JSON (Vercel auto-deploys)
        run: |
          git config user.name "onscript-bot"
          git config user.email "bot@onscript.news"
          git add data/derived
          # NO [skip ci]: schedule/dispatch-only workflow (never push-triggered), so the marker only
          # made Vercel skip the deploy. Removing it lets every data commit auto-deploy. §voice-wiring.
          git commit -m "data: collect $(date -u +%F)" || { echo "no derived changes"; exit 0; }
          # Art. XVI: the push must survive a docs/canon commit landing mid-run. On 2026-07-17 a
          # rejected non-fast-forward was swallowed by '|| echo' and a GREEN run published nothing.
          # Rebase-retry handles the benign race; a failure after that is real and must FAIL the
          # step so the dead-man fires. (Two pipeline runs cannot race each other: concurrency group.)
          # --autostash is load-bearing, not tidiness. This recovery path could NEVER work without it:
          # the run leaves modified files OUTSIDE `data/derived` (they are never staged), so the tree
          # is always dirty here, and `git pull --rebase` refuses with "cannot pull with rebase: You
          # have unstaged changes" — exit 128, the day's derived output lost, dead-man fired. It stayed
          # invisible until 2026-07-20, when a human push landed mid-run and the retry fired for the
          # first time. A recovery path that has never been exercised is a recovery path you do not
          # have; this one is on the critical path for every launch-morning commit that races a cron.
          git push origin main || { git pull --rebase --autostash origin main && git push origin main; }

      # Art. XVI: failure visibility belongs to the OUTERMOST layer. The in-process dead-man
      # (pipeline/ops.ntfy) cannot see a crash that happens before main() — an import-time death is
      # invisible to it by construction. This step sees every failure mode the job has.
      - name: Dead-man — notify on ANY failure (workflow-level, sees import-time death)
        if: failure()
        run: |
          curl -fsS -m 10 \
            -H "Title: OnScript RUN A (collect) FAILED" \
            -H "Priority: high" -H "Tags: rotating_light" \
            -d "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || echo "ntfy unreachable (topic unset or network)"
